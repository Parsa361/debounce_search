name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Print environment info
        run: |
          node -v
          npm -v

      - name: Install npm 11
        run: npm install -g npm@11

      - name: Print npm version after upgrade
        run: npm -v

      - name: Clean npm cache
        run: npm cache clean --force

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run type check
        run: npm run type-check

      - name: Run unit tests
        run: npm run test:run

      - name: Build project
        run: npm run build